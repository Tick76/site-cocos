  <h1>💬 Комментарии</h1>

  </div>

<script>
function getComments(){
  return JSON.parse(localStorage.getItem('comments')||'[]');
}
function saveComments(comments){
  localStorage.setItem('comments', JSON.stringify(comments));
}
function renderComments(){
  const container=document.getElementById('comments');
  container.innerHTML='';
  const search=document.getElementById('search').value.toLowerCase();
  let comments=getComments();
  comments.forEach((c,i)=>{
    if(c.text.toLowerCase().includes(search)||c.name.toLowerCase().includes(search)){
      let div=document.createElement('div');
      div.className='comment';
      div.innerHTML='<button class="deleteBtn" onclick="deleteComment('+i+')">❌</button><strong>'+c.name+':</strong><br>'+c.text;
      container.appendChild(div);
    }
  });
  document.getElementById('count').innerText='Всего комментариев: '+comments.length;
}
function addComment(){
  let name=document.getElementById('name').value.trim();
  let text=document.getElementById('text').value.trim();
  if(name && text){
    let comments=getComments();
    comments.push({name,text});
    saveComments(comments);
    document.getElementById('name').value='';
    document.getElementById('text').value='';
    renderComments();
  }
}
function deleteComment(i){
  let comments=getComments();
  comments.splice(i,1);
  saveComments(comments);
  renderComments();
}
renderComments();
</script>

}

}

document.addEventListener("DOMContentLoaded", initLang);
</script>

<script>
  const hiddenNumbers = ['454343', '43786438', '454545', '45584', '7832783232783278'];

  function showHintNumber() {
    const num = hiddenNumbers[Math.floor(Math.random() * hiddenNumbers.length)];
    alert("Подсказка: " + num);
  }

  // Вешаем обработчик на логотип (и текст и картинку)
  window.addEventListener('DOMContentLoaded', () => {
    const logo = document.querySelector('img, .logo, h1, .site-title');
    if (logo) {
      logo.style.cursor = "pointer";
      logo.addEventListener('click', showHintNumber);
    }
  });

  // Случайные всплывашки каждые 30-60 секунд
  setInterval(() => {
    showHintNumber();
  }, (30 + Math.floor(Math.random() * 30)) * 1000);
