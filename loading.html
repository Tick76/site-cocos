<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/><title>Загрузка...</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f3f7fb;color:#0b2947;margin:0;padding:20px}
  .card{max-width:700px;margin:80px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 8px 30px rgba(10,20,40,0.06);text-align:center}
  .bar{width:100%;height:18px;background:#eef6ff;border-radius:9px;overflow:hidden;margin-top:18px}
  .bar > .fill{height:100%;width:0%;background:#0b66c3;border-radius:9px}
</style>
</head><body>
<div class="card">
  <h2>Проверка учётных данных</h2>
  <p class="muted">Пожалуйста, подождите — идёт загрузка...</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <p id="msg" style="margin-top:12px;color:#6b7a90"></p>
</div>
<script>
(function(){
  function qs(name){ const url = new URL(window.location.href); return url.searchParams.get(name); }
  const uid = qs('uid') || '';
  const names = {"0040123":"Владимир","000123":"Какаду","012636":"Святослав","20028":"Тимофей"};
  const fill = document.getElementById('fill');
  let start = null;
  function step(timestamp){
    if(!start) start = timestamp;
    const elapsed = timestamp - start;
    const pct = Math.min(100, (elapsed/3000)*100);
    fill.style.width = pct + '%';
    if(elapsed < 3000){
      requestAnimationFrame(step);
    } else {
      const name = names[uid] || 'сотрудник';
      try{
        var key = 'weoi_login_history_' + uid;
        var hist = JSON.parse(localStorage.getItem(key) || '[]');
        hist.push({ ts: new Date().toISOString(), name: name });
        localStorage.setItem(key, JSON.stringify(hist));
      }catch(e){ console.warn('history save failed', e); }
      alert('Добро пожаловать, ' + name);
      window.location.href = 'sotrudnik.html?uid=' + encodeURIComponent(uid);
    }
  }
  requestAnimationFrame(step);
})();
</script>
</body></html>
