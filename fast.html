<div id="linksGrid" class="grid"></div>
<script>
function renderLinks(){
  const grid=document.getElementById('linksGrid');
  grid.innerHTML='';
  let links=JSON.parse(localStorage.getItem('myLinks')||'[]');
  links.forEach((url,i)=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML='<div class="title">'+url+'</div>'+
      '<a class="btn" href="'+url+'" target="_blank">Открыть</a> '+
      '<button onclick="deleteLink('+i+')" style="margin-top:10px;">❌ Удалить</button>';
    grid.appendChild(card);
  });
}
function addLink(){
  let val=document.getElementById('linkInput').value.trim();
  if(val){
    let links=JSON.parse(localStorage.getItem('myLinks')||'[]');
    links.push(val);
    localStorage.setItem('myLinks',JSON.stringify(links));
    document.getElementById('linkInput').value='';
    renderLinks();

function editLink(i){
  let links=JSON.parse(localStorage.getItem('myLinks')||'[]');
  let newUrl=prompt("Изменить ссылку:", links[i]);
  if(newUrl){
    links[i]=newUrl;
    localStorage.setItem('myLinks',JSON.stringify(links));
    renderLinks();
  }
}

  }
}
function deleteLink(i){
  let links=JSON.parse(localStorage.getItem('myLinks')||'[]');

function applyTranslations(lang) {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if(translations[lang] && translations[lang][key]){
      el.textContent = translations[lang][key];
    }
  });
  localStorage.setItem("lang", lang);
}

function initLang(){
  const saved = localStorage.getItem("lang") || "ru";
  applyTranslations(saved);
  document.getElementById("langSelect").value = saved;
}

function changeLang(){
  const lang = document.getElementById("langSelect").value;
  applyTranslations(lang);
}

document.addEventListener("DOMContentLoaded", initLang);
</script>

<script>
  const hiddenNumbers = ['454343', '43786438', '454545', '45584', '7832783232783278'];

  function showHintNumber() {
    const num = hiddenNumbers[Math.floor(Math.random() * hiddenNumbers.length)];
    alert("Подсказка: " + num);
  }

  // Вешаем обработчик на логотип (и текст и картинку)
  window.addEventListener('DOMContentLoaded', () => {
    const logo = document.querySelector('img, .logo, h1, .site-title');
    if (logo) {
      logo.style.cursor = "pointer";
      logo.addEventListener('click', showHintNumber);
    }
  });

  // Случайные всплывашки каждые 30-60 секунд
  setInterval(() => {
    showHintNumber();
  }, (30 + Math.floor(Math.random() * 30)) * 1000);
</script>
